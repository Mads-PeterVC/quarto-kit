title: Quarto Kit Dark
author: Quarto Kit contributors
version: 0.1.0
quarto-required: ">=1.8.0"
contributes:
  formats:
    revealjs:
      brand: ../quarto-kit/_brand.yml
      brand-mode: dark
      theme: [default, ../quarto-kit/theme-dark.scss]
      css: ../quarto-kit/fonts.css
      highlight-style: dracula
      width: 1600
      height: 900
      margin: 0.075
      center: false
      transition: fade
      transition-speed: fast
      background-transition: fade
      slide-number: c/t
      show-slide-number: all
      progress: true
      controls: true
      controls-layout: edges
      code-overflow: wrap
      code-line-numbers: false
      fig-cap-location: bottom
      tbl-cap-location: bottom
