title: Quarto Kit
author: Quarto Kit contributors
version: 0.1.0
quarto-required: ">=1.8.0"
contributes:
  formats:
    revealjs:
      brand: _brand.yml
      brand-mode: light
      theme: [default, theme-light.scss]
      css: fonts.css
      highlight-style: github
      width: 1600
      height: 900
      margin: 0.075
      center: false
      auto-stretch: false
      transition: fade
      transition-speed: fast
      background-transition: fade
      slide-number: c/t
      show-slide-number: all
      progress: true
      controls: true
      controls-layout: edges
      code-overflow: wrap
      code-line-numbers: false
      fig-cap-location: bottom
      tbl-cap-location: bottom
